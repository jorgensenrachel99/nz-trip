<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NZ Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mist:#E6EFEA; --paper:#F7FAF8; --ink:#16372E; --ink-2:#4B665D;
  --pounamu:#3F8C6B; --land:#9BC7AC; --land-edge:#6FA98A; --sea:#CFE2E4; --lake:#A9CFE0;
  --pohutu:#D8323C; --kowhai:#F4C542; --kowhai-soft:#FCEFC4; --line:#C9DAD1;
  --faint:#7FA394;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mist:#0F221C; --paper:#16302A; --ink:#E4F1EA; --ink-2:#A5C2B6;
    --pounamu:#6CC39B; --land:#2E5A48; --land-edge:#4B8069; --sea:#10282B; --lake:#1F4E5E;
    --pohutu:#FF5A61; --kowhai:#F4C542; --kowhai-soft:#3A3419; --line:#2A4A3F; --faint:#5E8A78;
  }
}
:root[data-theme="dark"]{
  --mist:#0F221C; --paper:#16302A; --ink:#E4F1EA; --ink-2:#A5C2B6;
  --pounamu:#6CC39B; --land:#2E5A48; --land-edge:#4B8069; --sea:#10282B; --lake:#1F4E5E;
  --pohutu:#FF5A61; --kowhai:#F4C542; --kowhai-soft:#3A3419; --line:#2A4A3F; --faint:#5E8A78;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;min-height:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--kowhai);outline-offset:2px;border-radius:6px}

/* top strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--mist);display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{font-family:"Bagel Fat One",Georgia,serif;font-size:20px;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.brand span{color:var(--pohutu)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.strip::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;min-width:40px;height:40px;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;padding:0 10px;transition:background .2s,color .2s,border-color .2s}
.pill:hover{border-color:var(--pounamu)}
.pill[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill.bday{border-color:var(--pohutu)}
.pill.bday[aria-current="true"]{background:var(--pohutu);border-color:var(--pohutu);color:#fff}

@media (max-width:600px){.brand{display:none}.top{padding:10px 10px}.maptag{font-size:12px;padding:4px 10px}}
/* layout */
main{display:grid;grid-template-columns:1fr;max-width:1240px;margin:0 auto}
.mapwrap{position:relative;height:44vh;min-height:280px;background:var(--sea);overflow:hidden}
.mapwrap svg{width:100%;height:100%;display:block;touch-action:pan-y}
.panel{padding:22px 18px 40px;min-width:0}
@media (min-width:900px){
  main{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0;padding:0 16px}
  .mapwrap{position:sticky;top:calc(63px + env(safe-area-inset-top,0px));height:calc(100vh - 95px - env(safe-area-inset-top,0px));margin:16px 0;border-radius:28px}
  .panel{padding:28px 8px 56px 40px}
}

/* map */
.land{fill:var(--land);stroke:var(--land-edge)}
.lake{fill:var(--lake)}
.ghost{fill:none;stroke:var(--faint);stroke-linecap:round;opacity:.55}
.leg{fill:none;stroke:var(--pohutu);stroke-linecap:round;stroke-linejoin:round}
.dot{fill:var(--faint)}
.pin circle{fill:var(--paper);stroke:var(--pohutu)}
.pin text{fill:var(--ink);font-family:Figtree,system-ui,sans-serif;font-weight:700;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
.pin.sleep circle{fill:var(--pohutu)}
.maptag{position:absolute;right:12px;bottom:12px;background:var(--paper);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.maptag i{display:inline-block;width:18px;height:0;border-top:3px solid var(--pohutu);vertical-align:middle;margin-right:4px}
.maptag i.fly{border-top-style:dashed}

/* day header */
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}
.num{font-family:"Bagel Fat One",Georgia,serif;font-size:clamp(84px,14vw,132px);line-height:.8;color:var(--pounamu);letter-spacing:-2px}
.bdayday .num{color:var(--pohutu)}
.date{font-weight:600;color:var(--ink-2);font-size:15px}
h1{font-family:"Bagel Fat One",Georgia,serif;font-weight:400;font-size:clamp(28px,4.4vw,40px);line-height:1.02;margin:4px 0 0}
.where{margin:0 0 18px;font-weight:600;color:var(--ink-2)}

/* travel legs */
.legs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.legs li{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:6px 14px 6px 8px;font-size:14px;font-weight:600}
.legs b{font-variant-numeric:tabular-nums;background:var(--pohutu);color:#fff;border-radius:999px;padding:2px 9px;font-size:13px}
.warn{background:var(--kowhai-soft);border-radius:14px;padding:8px 14px;font-weight:600;font-size:14px;margin:0 0 14px;display:inline-block}

/* sleep */
.sleep{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--paper);border-radius:18px;padding:12px 16px;margin:0 0 22px}
.sleep .ico{font-size:24px}
.sleep strong{display:block;font-size:16px}
.sleep small{opacity:.75;font-size:13px}
.sleep .st{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.ok{background:var(--pounamu);color:#fff}
.st.todo{background:var(--kowhai);color:#16372E}

/* agenda */
.agenda{list-style:none;margin:0;padding:0;position:relative}
.agenda::before{content:"";position:absolute;left:95px;top:10px;bottom:10px;border-left:2px dotted var(--line)}
.it{display:grid;grid-template-columns:64px 44px 1fr;gap:0 10px;align-items:start;padding:7px 0}
.t{font-weight:700;font-size:14px;text-align:right;padding-top:11px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.e{width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:22px;position:relative;z-index:1;border:2px solid var(--paper)}
.card{border-radius:16px;padding:9px 14px;background:var(--paper);min-height:44px}
.card p{margin:0;font-weight:600}
.card small{display:block;color:var(--ink-2);font-size:13px;font-weight:500;margin-top:1px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.booked .e{border-color:var(--pounamu)}
.booked .badge{background:var(--pounamu);color:#fff}
.maybe .card{background:transparent;border:1.5px dashed var(--faint)}
.idea .card{background:var(--kowhai-soft)}
.idea .badge{background:var(--kowhai);color:#16372E}
.note .card{background:transparent;padding-left:4px}
.note .card p{font-weight:500;color:var(--ink-2)}
.or{grid-column:3;font-size:12px;font-weight:700;color:var(--faint);padding:0 0 0 14px;margin:-4px 0}

.dur{display:inline-block;font-variant-numeric:tabular-nums;background:var(--pohutu);color:#fff;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700;margin-left:4px;vertical-align:1px}
.travel .e{width:32px;height:32px;font-size:16px;margin:6px;background:var(--mist);border-color:var(--mist)}
.travel .card{background:transparent;min-height:0;padding:10px 4px}
.travel .card p{font-weight:600;color:var(--ink-2);font-size:14.5px}
.travel .t{padding-top:10px}
/* nav */
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.nav button{border:0;background:var(--pounamu);color:#fff;font-weight:700;border-radius:999px;padding:12px 20px;cursor:pointer;min-height:44px}
.nav button[disabled]{visibility:hidden}

/* cover */
.cover h1{font-size:clamp(44px,7vw,72px);line-height:.95;margin:6px 0 10px}
.cover .sixty{font-family:"Bagel Fat One",Georgia,serif;color:var(--pohutu)}
.lede{font-weight:600;color:var(--ink-2);margin:0 0 20px}
.key{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.key span{font-size:13px;font-weight:600;border-radius:999px;padding:4px 12px}
.key .k1{background:var(--pounamu);color:#fff}.key .k2{border:1.5px dashed var(--faint)}.key .k3{background:var(--kowhai-soft)}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.toc button{text-align:left;border:0;background:var(--paper);border-radius:16px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center}
.toc button:hover{background:var(--kowhai-soft)}
.toc .n{font-family:"Bagel Fat One",Georgia,serif;font-size:28px;color:var(--pounamu);grid-row:span 2;line-height:1}
.toc .bd .n{color:var(--pohutu)}
.toc b{font-size:14px;line-height:1.15}
.toc small{font-size:12px;color:var(--ink-2)}

.panel > *{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.panel > *{animation:none}.confetti{display:none}}
</style>
</head>

"]]}, {"n": 14, "date": "Fri, Nov 27", "short": "Glowworms, back to Auckland", "title": "Glowworms and home stretch", "where": "Rotorua to Waitomo to Auckland", "box": [632, 255, 205, 195], "legs": [{"a": "Rotorua", "b": "Hobbiton", "m": "drive", "t": "1h"}, {"a": "Hobbiton", "b": "Waitomo", "m": "drive", "t": "1h 30m"}, {"a": "Waitomo", "b": "Auckland", "m": "drive", "t": "2h 45m"}], "pins": [["Rotorua", "r"], ["Hobbiton", "r"], ["Waitomo", "l"], ["Auckland", "l", "sleep"]], "warn": "5+ hours of driving and two tours. Hobbiton might fit better elsewhere.", "sleep": ["Auckland", "Britomart, Hilton, or M Social", "todo"], "items": [{"tr": 0, "t": "~8:15a"}, ["~9:30a", "🧙", "Hobbiton tour", "About 2 hours", "m"], {"tr": 1, "t": "~12:15p"}, ["~2p", "🪱", "Black water rafting", "Ruakuri Cave, #WTOMO-4184347", "b"], {"tr": 2, "t": "~5:30p"}]}, {"n": 15, "date": "Sat, Nov 28", "short": "Auckland to home", "title": "Haere rā, New Zealand", "where": "Auckland to Los Angeles", "box": [560, 90, 470, 380], "legs": [{"a": "Auckland", "b": "AKL", "m": "drive", "t": "35m"}, {"a": "AKL", "b": "LAX", "m": "fly", "t": "12h 05m"}], "pins": [["Auckland", "l"], ["LAX", "l"]], "sleep": ["Home sweet home", "Land Saturday before you took off", "", "🏠"], "items": [["~9a", "🍇", "Waiheke Island wineries", "40 min ferry", "m"], ["~1p", "⛵", "America’s Cup sailing", "If you skipped it on Day 2", "m"], {"tr": 0, "t": "~5:45p"}, ["6:30p", "🚙", "Return car at AKL", "", "b"], ["8:20p", "🛫", "Fly home", "NZ6, seats 36A 36D 37C 37D 38C", "b", "12h 05m"], ["11:25a", "🏠", "Land at LAX", "Same Saturday", "b"]]}];

const $=s=>document.querySelector(s);
const svg=$('#map'),legsG=$('#legsG'),pinsG=$('#pinsG'),ghost=$('#ghost'),panel=$('#panel'),strip=$('#strip');
const NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
function legPath(a,b,m,cc){const [x1,y1]=P[a],[x2,y2]=P[b];const dx=x2-x1,dy=y2-y1;const c=cc!=null?cc:(m==='drive'?0.08:0.22);
  const mx=(x1+x2)/2+dy*c,my=(y1+y2)/2-dx*c;return `M${x1},${y1}Q${mx},${my} ${x2},${y2}`}
/* ghost route of whole trip */
DAYS.forEach(d=>(d.legs||[]).forEach(l=>{ghost.append(el('path',{d:legPath(l.a,l.b,l.m,l.c),class:'ghost','data-sw':1.6,'data-dash':l.m==='drive'?'':'4 5'}))}));
const allStops=[...new Set(DAYS.flatMap(d=>(d.pins||[]).map(p=>p[0])))];
allStops.forEach(k=>ghost.append(el('circle',{cx:P[k][0],cy:P[k][1],class:'dot','data-r':2.6})));

let vb=[0,0,1000,1388];
function scale(v){const r=svg.getBoundingClientRect();return Math.max(v[2]/r.width,v[3]/r.height)||1}
function applyScale(){const s=scale(vb);
  svg.querySelectorAll('[data-sw]').forEach(e=>{e.setAttribute('stroke-width',e.dataset.sw*s);if(e.dataset.dash)e.setAttribute('stroke-dasharray',e.dataset.dash.split(' ').map(n=>n*s).join(' '))});
  svg.querySelectorAll('[data-r]').forEach(e=>e.setAttribute('r',e.dataset.r*s));
  svg.querySelectorAll('[data-fs]').forEach(e=>{e.setAttribute('font-size',e.dataset.fs*s);e.setAttribute('stroke-width',4*s);
    const dir=e.dataset.dir==='l'?-1:1;e.setAttribute('x',+e.dataset.x+dir*11*s);e.setAttribute('y',+e.dataset.y+4.5*s)});
  svg.querySelector('.land').setAttribute('stroke-width',1*s);}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let anim;
function zoomTo(t){t=[t[0]-t[2]*.1,t[1]-t[3]*.1,t[2]*1.2,t[3]*1.2];cancelAnimationFrame(anim);const from=vb.slice(),t0=performance.now(),D=reduce?0:850;
  const step=now=>{const p=D?Math.min(1,(now-t0)/D):1,e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    vb=from.map((v,i)=>v+(t[i]-v)*e);svg.setAttribute('viewBox',vb.join(' '));applyScale();if(p<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}

function drawDay(d){legsG.innerHTML='';pinsG.innerHTML='';
  (d.legs||[]).forEach((l,i)=>{const p=el('path',{d:legPath(l.a,l.b,l.m,l.c),class:'leg','data-sw':l.m==='drive'?4:3,'data-dash':l.m==='drive'?'':'7 7'});
    legsG.append(p);
    if(l.m==='drive'&&!reduce){const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
      p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:900,delay:500+i*(d.n===0?50:350),fill:'forwards',easing:'ease-out'})}
    else if(!reduce){p.animate([{opacity:0},{opacity:1}],{duration:600,delay:500+i*(d.n===0?50:250),fill:'backwards'})}});
  (d.pins||[]).forEach(([k,dir,cls])=>{const g=el('g',{class:'pin '+(cls||'')});const [x,y]=P[k];
    g.append(el('circle',{cx:x,cy:y,'data-r':6,'data-sw':2.5}));
    const t=el('text',{'data-x':x,'data-y':y,'data-fs':13,'data-dir':dir||'r','text-anchor':dir==='l'?'end':'start'});t.dataset.x=x;t.dataset.y=y;t.textContent=nm(k);g.append(t);pinsG.append(g)});
  svg.setAttribute('aria-label',d.pins?('Map: '+d.pins.map(p=>nm(p[0])).join(', ')):'Map of New Zealand');
  applyScale();zoomTo(d.box)}

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const LBL={b:'Booked',i:'Idea'};const MODE={drive:['🚗','Drive'],ferry:['⛴️','Ferry'],fly:['✈️','Fly']};
function render(i){cur=i;const d=DAYS[i];
  strip.querySelectorAll('.pill').forEach((b,j)=>b.setAttribute('aria-current',j===i));
  strip.children[i].scrollIntoView({inline:'center',block:'nearest',behavior:reduce?'auto':'smooth'});
  document.body.classList.toggle('bdayday',!!d.bday);
  if(i===0){panel.innerHTML=cover()}else{
  panel.innerHTML=`<div class="head"><div class="num">${d.n}</div><div><div class="date">${d.date}${d.tag?' '+d.tag:''}</div><h1>${esc(d.title)}</h1></div></div>
  <p class="where">${esc(d.where)}</p>
  ${d.warn?`<p class="warn">⚠️ ${d.warn}</p>`:''}
  <div class="sleep"><span class="ico">${d.sleep[3]||'🛏️'}</span><div><strong>${esc(d.sleep[0])}</strong>${d.sleep[1]?`<small>${esc(d.sleep[1])}</small>`:''}</div>${d.sleep[2]?`<span class="st ${d.sleep[2]==='ok'?'ok':'todo'}">${d.sleep[2]==='ok'?'Booked':'To book'}</span>`:''}</div>
  <ol class="agenda">${d.items.map(it=>it==='or'?`<li class="it"><span></span><span></span><span class="or">or</span></li>`:
   it.tr!=null?(l=>`<li class="it travel"><span class="t">${it.t}</span><span class="e" aria-hidden="true">${MODE[l.m][0]}</span><div class="card"><p>${MODE[l.m][1]} to ${nm(l.b)} <b class="dur">${l.t}</b></p></div></li>`)(d.legs[it.tr]):
   `<li class="it ${({b:'booked',m:'maybe',i:'idea',n:'note'})[it[4]]||''}"><span class="t">${it[0]||''}</span><span class="e" aria-hidden="true">${it[1]}</span><div class="card"><p>${esc(it[2])}${LBL[it[4]]?`<span class="badge">${LBL[it[4]]}</span>`:''}${it[5]?` <b class="dur">${it[5]}</b>`:''}</p>${it[3]?`<small>${esc(it[3])}</small>`:''}</div></li>`).join('')}</ol>`}
  panel.insertAdjacentHTML('beforeend',`<div class="nav"><button id="prev" ${i===0?'disabled':''}>‹ ${i>1?'Day '+(i-1):'Overview'}</button><button id="next" ${i===DAYS.length-1?'disabled':''}>${i===0?'Start with Day 1':'Day '+(i+1)} ›</button></div>`);
  $('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);
  drawDay(d);
  if(d.bday&&!reduce)confetti();
  history.replaceState(null,'',i?'#day'+i:'#');}
function cover(){return `<div class="cover"><div class="date">Nov 13 to 28, 2026</div><h1>Mom’s New Zealand Birthday Trip</h1>
  
  <div class="key"><span class="k1">Booked</span><span class="k2">Maybe</span><span class="k3">💡 Idea to consider</span></div>
  <div class="toc">${DAYS.slice(1).map(d=>`<button data-go="${d.n}" class="${d.bday?'bd':''}"><span class="n">${d.n}</span><b>${esc(d.short)}</b><small>${d.date}</small></button>`).join('')}</div></div>`}
function go(i){if(i<0||i>=DAYS.length)return;render(i);if(innerWidth<900)window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})}
let cur=0;
DAYS.forEach((d,i)=>{const b=document.createElement('button');b.className='pill'+(d.bday?' bday':'');b.textContent=i===0?'★':(d.bday?'🎂':i);
  b.setAttribute('aria-label',i===0?'Overview':'Day '+i+', '+d.date);b.onclick=()=>go(i);strip.append(b)});
$('#home').onclick=()=>go(0);
panel.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let sx=null;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});let sy;
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5&&!e.target.closest('.strip'))go(cur+(dx<0?1:-1));sx=null},{passive:true});
addEventListener('resize',applyScale);
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#D8323C','#F4C542','#3F8C6B','#fff','#2A6F8F'];
  for(let k=0;k<70;k++){const i=document.createElement('i');i.style.left=Math.random()*100+'%';i.style.background=cols[k%5];i.style.animationDelay=Math.random()*.8+'s';i.style.transform=`rotate(${Math.random()*360}deg)`;c.append(i)}
  document.body.append(c);setTimeout(()=>c.remove(),3800)}
const h=+(location.hash.match(/day(\d+)/)||[])[1];render(h>0&&h<DAYS.length?h:0);
</script>
